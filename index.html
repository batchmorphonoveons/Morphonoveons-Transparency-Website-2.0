<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morphonoveons Batch 2026 Transparency Portal</title>
    <meta name="description" content="A centralized transparency portal for Batch 2026 to track collections, expenses, selling activities, jersey funds, and audit logs with live Google Sheets integration." />
    <meta property="og:title" content="Morphonoveons Batch 2026 Transparency Portal" />
    <meta property="og:description" content="A centralized transparency portal for Batch 2026 to track collections, expenses, selling activities, jersey funds, and audit logs with live Google Sheets integration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <script>
  window.addEventListener('error', function (e) {
    var msg = (e.target && e.target.src)
      ? 'Failed to load: ' + e.target.src
      : e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '');
    var box = document.createElement('pre');
    box.style.cssText = 'color:#b91c1c;padding:16px;white-space:pre-wrap;font-size:14px';
    box.textContent = msg;
    (document.body || document.documentElement).prepend(box);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var box = document.createElement('pre');
    box.style.cssText = 'color:#b91c1c;padding:16px;white-space:pre-wrap;font-size:14px';
    box.textContent = String(e.reason);
    (document.body || document.documentElement).prepend(box);
  });
</script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
